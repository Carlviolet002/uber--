    host: localhost
    port: 5672
    username: mall
    password: ${RABBITMQ_PASSWORD:change-me}
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: localhost:8848
        namespace: ${NACOS_NAMESPACE:}
mall:
  mock:
    enabled: false
