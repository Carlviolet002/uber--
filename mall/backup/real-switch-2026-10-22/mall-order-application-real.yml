    url: jdbc:mysql://localhost:3306/mall_order?serverTimezone=Asia/Shanghai&useSSL=false&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true
    username: mall
    password: ${MYSQL_PASSWORD:change-me}
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:change-me}
